name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Chexsa
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Check Python files
        run: python -m compileall -q chexsa_browser app_runtime.py agent.py cli.py voice.py desktop_state.py desktop_actions.py llm.py tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Chrome browser fixtures
        timeout-minutes: 10
        env:
          CHEXSA_FIXTURE_DIAGNOSTICS: "1"
        run: .\scripts\test_browser.ps1 -Python python

      - name: Save failed fixture diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-diagnostics-${{ matrix.python-version }}
          path: .chexsa/fixture-diagnostics
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
