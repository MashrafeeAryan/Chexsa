<!doctype html><html lang="en"><meta charset="utf-8"><title>Chexsa controls</title>
<style>body{font:16px sans-serif;margin:20px}section{padding:20px;border:1px solid;margin:15px}button,input{padding:8px}</style>
<main aria-label="First region"><button id="first" onclick="this.dataset.clicked='yes'">Send</button><button>Send later</button><button aria-label='Save "draft": C:\notes'>Quoted name</button></main>
<section role="region" aria-label="Second region"><button id="second" onclick="this.dataset.clicked='yes'">Send</button><input aria-label="Name"><input aria-label="Choice" type="checkbox"><select aria-label="Colour"><option>Blue</option><option>Red</option></select><input aria-label="Upload" type="file"></section>
<div id="shadow"></div><iframe title="Embedded controls" src="frame.html"></iframe>
<canvas id="visual" width="180" height="70" style="border:1px solid" onclick="window.visualClicked=true"></canvas>
<p role="status" id="status">Ready</p><div style="height:1500px">Scrollable content</div>
<script>document.querySelector('#shadow').attachShadow({mode:'open'}).innerHTML='<button aria-label="Shadow action" onclick="this.dataset.clicked=\'yes\'">Shadow action</button>';const c=document.querySelector('#visual');c.getContext('2d').fillText('Visual-only control',15,35);</script></html>
