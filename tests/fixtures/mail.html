<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Chexsa mail fixture</title>
<style>body{font:16px sans-serif;margin:24px}section{border:1px solid #888;padding:18px;margin:16px}label{display:block;margin:10px}input,textarea,[contenteditable]{padding:8px;border:1px solid #999}#body{min-height:70px}button{padding:8px} [hidden]{display:none!important}</style>
<nav aria-label="Mail navigation"><button id="compose" onclick="document.querySelector('#draft').hidden=false;document.querySelector('#to').focus()">Compose</button><input aria-label="Search mail"></nav>
<main aria-label="Inbox"><h1>Inbox</h1><button id="other-send" onclick="document.querySelector('#wrong').textContent='Wrong Send clicked'">Send</button><p id="wrong"></p><div id="rows"></div></main>
<section id="draft" role="dialog" aria-label="New message" hidden>
<h2>New message</h2><form id="form">
<label>To <input id="to" aria-label="Recipients" autocomplete="off"></label><div id="recipients" aria-label="Committed recipients"></div>
<label>Subject <input id="subject" aria-label="Subject"></label>
<label id="body-label">Message body</label><div id="body" role="textbox" aria-labelledby="body-label" contenteditable="true"></div>
<label>Priority <select id="priority"><option>Normal</option><option>High</option></select></label>
<label><input type="checkbox" id="copy"> Keep a copy</label>
<label>Attachment <input type="file" id="attachment"></label>
<button id="send" type="submit">Send</button><button type="button" disabled>Unavailable</button>
</form></section>
<p id="result" role="status" aria-live="polite"></p>
<script>
window.sendCount=0;window.lastMail=null;
document.querySelector('#to').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();document.querySelector('#recipients').textContent=event.target.value;event.target.value='';}});
document.querySelector('#form').addEventListener('submit',event=>{
 event.preventDefault();const mode=new URLSearchParams(location.search).get('mode');
 const to=document.querySelector('#recipients').textContent||document.querySelector('#to').value;
 if(!to.includes('@')){document.querySelector('#result').textContent='Invalid recipient';return;}
 if(mode==='failure'){document.querySelector('#result').textContent='Message could not be sent';return;}
 window.sendCount++;window.lastMail={to,subject:document.querySelector('#subject').value,body:document.querySelector('#body').textContent};
 document.querySelector('#draft').hidden=true;
 if(mode!=='uncertain')setTimeout(()=>{document.querySelector('#result').textContent='Message sent';},mode==='delay'?500:0);
});
const size=Number(new URLSearchParams(location.search).get('rows')||0);
for(let i=0;i<size;i++){const row=document.createElement('article');row.setAttribute('aria-label','Message '+i);row.innerHTML='<button>Open message '+i+'</button><button>Archive</button>';document.querySelector('#rows').append(row);}
</script></html>
