[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chexsa"
version = "0.1.0"
description = "A personal computer-use AI agent."
requires-python = ">=3.11"

# Libraries Chexsa needs to run.
dependencies = [
    "google-genai",
    "openai",
    "playwright",
    "pywinauto==0.6.9",
    "python-dotenv",
]

[project.optional-dependencies]
voice = [
    "SpeechRecognition[audio]>=3.14,<4",
]

[project.scripts]
# Start Chexsa from the terminal.
chexsa = "cli:main"
chexsa-voice = "voice:main"

[tool.setuptools]
packages = ["chexsa_browser"]
# Python files that are part of Chexsa.
py-modules = [
    "agent",
    "browser_state",
    "browser_actions",
    "desktop_state",
    "desktop_actions",
    "llm",
    "cli",
    "voice",
]
