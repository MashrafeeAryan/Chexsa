[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chexsa"
version = "0.1.0"
description = "A personal computer-use AI agent."
requires-python = ">=3.11"

# Libraries Chexsa needs to run.
dependencies = [
    "google-genai",
    "openai",
    "playwright",
    "pywinauto @ git+https://github.com/pywinauto/pywinauto.git@18d2a95cebed2f0061ab4e4c80c3a76ece5dd4f3",
    "python-dotenv",
]

[project.scripts]
# Start Chexsa from the terminal with the "chexsa" command.
chexsa = "cli:main"

[tool.setuptools]
# Python files that are part of Chexsa.
py-modules = [
    "agent",
    "browser_state",
    "browser_actions",
    "llm",
    "cli",
]
