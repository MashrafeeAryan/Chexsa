[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chexsa"
version = "0.1.0"
description = "A personal computer-use AI agent."
requires-python = ">=3.11"

[project.scripts]
# Let users start the terminal interface with a simple "chexsa" command.
chexsa = "chexsa.cli:main"
